<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA fiscal 2026 second-quarter revenue</title>
  <desc id="desc">Total revenue 46.7 billion US dollars. Data Center 41.1 billion and other businesses approximately 5.6 billion. Quarter ended July 27, 2025.</desc>
  <rect width="960" height="600" fill="#f5f7fc"/>
  <path d="M56 58H904" stroke="#3454d1" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="103" font-size="22" fill="#626975" letter-spacing="3">NVIDIA · FY2026 Q2</text>
    <text x="56" y="196" font-size="76" fill="#20242c" font-weight="700">$46.7B</text>
    <text x="58" y="237" font-size="25" fill="#626975">QUARTERLY REVENUE</text>
    <text x="902" y="189" font-size="43" text-anchor="end" fill="#3454d1">+56%</text>
    <text x="902" y="229" font-size="23" text-anchor="end" fill="#626975">YEAR OVER YEAR</text>
    <rect x="56" y="288" width="746" height="70" fill="#3454d1"/>
    <rect x="802" y="288" width="102" height="70" fill="#b7c5f2"/>
    <circle cx="64" cy="406" r="8" fill="#3454d1"/>
    <text x="88" y="414" font-size="26" fill="#20242c">Data Center</text>
    <text x="904" y="414" font-size="28" text-anchor="end" fill="#20242c" font-weight="700">$41.1B</text>
    <circle cx="64" cy="461" r="8" fill="#b7c5f2"/>
    <text x="88" y="469" font-size="26" fill="#626975">Other businesses</text>
    <text x="904" y="469" font-size="28" text-anchor="end" fill="#626975">~$5.6B</text>
    <path d="M56 508H904" stroke="#dce0e6" stroke-width="2"/>
    <text x="56" y="551" font-size="20" fill="#626975">Quarter ended Jul 27, 2025 · Rounded figures</text>
    <text x="904" y="551" font-size="20" text-anchor="end" fill="#3454d1">SIFT / 01</text>
  </g>
</svg>
